<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión - PrivateRoute</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav>
        <a href="index.html" class="logo">PrivateRoute</a>
    </nav>

    <div class="contenedor-registro">
        <div class="tarjeta-registro">
            <h1>Iniciar sesión</h1>
            <p class="subtitulo-registro">Bienvenido de nuevo a PrivateRoute.</p>

            <form id="formulario-login">
                <label for="correo">Correo electrónico</label>
                <input type="email" id="correo" placeholder="tucorreo@ejemplo.com">

                <label for="contrasena">Contraseña</label>
                <input type="password" id="contrasena" placeholder="Tu contraseña">

                <button type="submit" class="btn-crear-cuenta">Iniciar sesión</button>
            </form>

            <p class="link-login">¿No tienes cuenta? <a href="registro.html">Regístrate</a></p>
        </div>
    </div>

    <script src="script-login.js"></script>
</body>
</html>
